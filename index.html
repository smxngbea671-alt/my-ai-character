<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal AI Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex overflow-hidden font-sans">

  <!-- Sidebar -->
  <div class="w-80 bg-slate-800 border-r border-slate-700 flex flex-col p-4">
    <h1 class="text-xl font-bold text-indigo-400 mb-6 flex items-center gap-2">
      <i class="fa-solid fa-[#000]"></i> My AI Character
    </h1>
    
    <button id="btn-show-create" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 mb-6">
      <i class="fa-solid fa-plus"></i> สร้างตัวละครใหม่
    </button>

    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">ตัวละครของคุณ</div>
    <div id="character-list" class="flex-1 overflow-y-auto space-y-2">
      <!-- รายชื่อตัวละครจะมาขึ้นตรงนี้ -->
    </div>

    <!-- API Key Input -->
    <div class="mt-auto pt-4 border-t border-slate-700">
      <label class="block text-xs text-slate-400 mb-1">Gemini API Key</label>
      <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col bg-slate-950 relative">

    <!-- View 1: Form สร้างตัวละคร -->
    <div id="view-create" class="flex-1 p-8 overflow-y-auto max-w-2xl mx-auto w-full">
      <h2 class="text-2xl font-bold mb-6 text-slate-100">สร้างตัวละครใหม่</h2>
      <form id="create-character-form" class="space-y-5">
        
        <!-- รูปโปรไฟล์ -->
        <div>
          <label class="block text-sm font-medium mb-2">รูปโปรไฟล์ตัวละคร</label>
          <div class="flex items-center gap-4">
            <img id="avatar-preview" src="https://via.placeholder.com/100" class="w-20 h-20 rounded-full object-cover border-2 border-indigo-500">
            <input type="file" id="avatar-file" accept="image/*" class="text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
          </div>
        </div>

        <!-- ชื่อ -->
        <div>
          <label class="block text-sm font-medium mb-1">ชื่อตัวละคร</label>
          <input type="text" id="char-name" required placeholder="เช่น อาริสา, ลูคัส" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>

        <!-- บุคลิก / Prompt -->
        <div>
          <label class="block text-sm font-medium mb-1">บุคลิก / นิสัย / บทบาทสมมติ (System Prompt)</label>
          <textarea id="char-prompt" rows="5" required placeholder="เช่น เป็นเพื่อนสนิทที่คอยให้กำลังใจ พูดยกย่องผู้ใช้ มักพูดจาอ่อนหวาน ละเอียดอ่อน..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>

        <!-- คำทักทายแรก -->
        <div>
          <label class="block text-sm font-medium mb-1">ข้อความทักทายแรก (Greeting)</label>
          <input type="text" id="char-greeting" placeholder="เช่น สวัสดีครับวันนี้เป็นยังไงบ้าง?" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition">
          บันทึกตัวละคร
        </button>
      </form>
    </div>

    <!-- View 2: หน้าห้องแชท -->
    <div id="view-chat" class="hidden flex-1 flex flex-col h-full">
      <!-- Chat Header -->
      <div class="p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img id="chat-avatar" class="w-10 h-10 rounded-full object-cover">
          <div>
            <h3 id="chat-name" class="font-bold text-slate-100"></h3>
            <span class="text-xs text-emerald-400 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span> พร้อมคุยแล้ว</span>
          </div>
        </div>
        <button id="btn-clear-chat" class="text-xs text-rose-400 hover:underline">ล้างประวัติแชท</button>
      </div>

      <!-- Chat Messages -->
      <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4">
        <!-- ข้อความจะเพิ่มตรงนี้ -->
      </div>

      <!-- Chat Input Bar -->
      <div class="p-4 bg-slate-900 border-t border-slate-800">
        <form id="chat-form" class="flex gap-2 max-w-4xl mx-auto">
          <input type="text" id="chat-input" placeholder="พิมพ์ข้อความคุยที่นี่..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-medium transition flex items-center gap-2">
            <span>ส่ง</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
